<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>DCC Controller + Auto Drive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">



<style>
/* PC（横幅 800px 以上）のときだけサイズを調整 */
@media (min-width: 800px) {

  body {
    font-size: 18px;
  }

  h1 {
    font-size: 32px;
  }

  .btn {
    width: 160px;
    height: 60px;
    font-size: 20px;
  }

  input[type="number"] {
    font-size: 20px;
    width: 160px;
  }

  .func-btn {
    font-size: 18px;
    max-width: 120px;
  }

  #log {
    font-size: 16px;
    height: 200px;
  }

  #speedVal {
    font-size: 20px;
  }
}

</style>



</head>

<body>

<h1>DCC Controller</h1>

<!-- 車両ID入力 -->
<div>
  <label style="font-size:4vw;">車両ID：</label>
  <input id="locoId" type="number" value="49152">
  <button class="btn" onclick="saveLocoId()">Set</button>
</div>
<br>

<!-- 速度スライダー -->
<div>
  <input id="speed" type="range" min="0" max="100" value="0" class="slider">
  <p style="font-size:4vw;">Speed: <span id="speedVal">0</span></p>
</div>

<!-- 方向 -->
<div>
  <button class="btn" onclick="setDir(1)">Forward</button>
  <button class="btn" onclick="setDir(0)">Reverse</button>
</div>

<!-- パワー -->
<div>
  <button class="btn" onclick="setPower(1)">Power ON</button>
  <button class="btn" onclick="setPower(0)">Power OFF</button>
</div>

<!-- Fキー -->
<h3 style="font-size:5vw;">Functions F0〜F12</h3>
<div class="func-grid" id="funcGrid"></div>

<!-- 自動運転 -->
<h3 style="font-size:5vw;">Auto Drive</h3>
<button id="autoBtn" class="btn" style="width:40vw;">自動運転 OFF</button>

<p style="font-size:4vw;">検知UID: <span id="uid">---</span></p>

<!-- ログ -->
<h3 style="font-size:5vw;">Log</h3>
<div id="log"></div>


<!-- ★ JavaScript（完全統合版） -->
<script>
// ★ R4 WiFi / Atom Lite の IP
const R4_IP   = "192.168.0.100";
const ATOM_IP = "192.168.0.101";

// ★ 車両ID
let LOCO_ID = 49206;

// ★ 保存されたIDを復元
window.onload = () => {
  const saved = localStorage.getItem("locoId");
  if (saved) {
    LOCO_ID = parseInt(saved);
    document.getElementById("locoId").value = LOCO_ID;
  }
  createFunctionButtons();
};

// ★ 車両IDを保存
function saveLocoId() {
  LOCO_ID = parseInt(document.getElementById("locoId").value) + 49152;
  localStorage.setItem("locoId", LOCO_ID);
  addLog("Set Loco ID = " + LOCO_ID);
}

// ★ ログ追加
function addLog(text) {
  const logBox = document.getElementById("log");
  const time = new Date().toLocaleTimeString();
  logBox.innerHTML += `[${time}] ${text}<br>`;
  logBox.scrollTop = logBox.scrollHeight;
  console.log("LOG:", text);
}

// ★ HTTP GET 送信
function sendCmd(cmd) {
  addLog("SEND: " + cmd);
  fetch(`http://${R4_IP}/cmd?c=${cmd}`, { mode: "no-cors" })
    .then(() => addLog("OK"))
    .catch(() => addLog("OK (ignored)"));
}

// ★ 方向
function setDir(dir) { sendCmd(`setLocoDirection(${LOCO_ID},${dir})`); }

// ★ パワー
function setPower(p) { sendCmd(`setPower(${p})`); }

// ★ Fキー
let funcState = new Array(13).fill(0);

function createFunctionButtons() {
  const grid = document.getElementById("funcGrid");
  grid.innerHTML = "";
  for (let f = 0; f <= 12; f++) {
    const btn = document.createElement("button");
    btn.id = "f" + f;
    btn.className = "func-btn";
    btn.innerText = "F" + f;
    btn.onclick = () => toggleFunc(f);
    grid.appendChild(btn);
  }
}

function toggleFunc(f) {
  funcState[f] = funcState[f] ? 0 : 1;
  const btn = document.getElementById("f" + f);
  if (funcState[f]) btn.classList.add("on");
  else btn.classList.remove("on");
  sendCmd(`setLocoFunction(${LOCO_ID},${f},${funcState[f]})`);
}

// ★ スピード
let lastSend = 0;
let lastSpeed = 0;

document.getElementById("speed").addEventListener("input", function() {
  const now = Date.now();
  const v = parseInt(this.value);
  document.getElementById("speedVal").innerText = v;

  let interval = (v < lastSpeed) ? 50 : 100;
  if (now - lastSend > interval) {
    lastSend = now;
    sendCmd(`setLocoSpeed(${LOCO_ID},${v},1)`);
  }
  lastSpeed = v;
});

// ★ 自動運転
let autoMode = false;
let lastUID = "";
let targetUID = "5a04bfa00c4189";
let autoBusy = false;
let autoInterval = 4000;

document.getElementById("autoBtn").onclick = () => {
  autoMode = !autoMode;
  document.getElementById("autoBtn").textContent =
    autoMode ? "自動運転 ON" : "自動運転 OFF";
  addLog("Auto Mode = " + (autoMode ? "ON" : "OFF"));
};

// ★ 自動運転ループ
function autoLoop() {

  // ★ 自動運転中はセンサを完全に無視
  if (autoBusy) {
    setTimeout(autoLoop, 200);
    return;
  }

  fetch(`http://${ATOM_IP}/uid`)
    .then(res => res.text())
    .then(uid => {
      uid = uid.trim();
      document.getElementById("uid").textContent = uid;

      if (uid !== "" && uid !== lastUID) {
        addLog("Detected UID = " + uid);
        lastUID = uid;
      }

      if (autoMode && uid === targetUID) {
        autoBusy = true;   // ★ ここでロック
        runAutoSequence();
      }
    });

  setTimeout(autoLoop, 200);
}



autoLoop();

// ★ 自動運転シーケンス

function runAutoSequence() {
  addLog("Auto: Start sequence for Loco " + LOCO_ID);

  // ① 減速
  sendCmd(`setLocoSpeed(${LOCO_ID},20,1)`);
  addLog("Auto: Slow down");

  setTimeout(() => {

    // ② 停止
    sendCmd(`setLocoSpeed(${LOCO_ID},0,1)`);
    addLog("Auto: Stop");

    setTimeout(() => {

      // ③ 反転
      addLog("Auto: Reverse");
      sendCmd(`setLocoDirection(${LOCO_ID},1)`);
      setTimeout(() => sendCmd(`setLocoDirection(${LOCO_ID},0)`), 3000);

      // ★ ④ 反転後の再加速（これが抜けていた）
      setTimeout(() => {
        sendCmd(`setLocoSpeed(${LOCO_ID},20,1)`);
        addLog("Auto: Re-Start after reverse");
      }, 3000);

      // ⑤ インターバル
      addLog("Auto: Interval " + autoInterval + "ms");

      setTimeout(() => {
        autoBusy = false;
        lastUID = "";
        addLog("Auto: Ready");
      }, autoInterval);

    }, 3000);

  }, 3000);
}


</script>

</body>
</html>
